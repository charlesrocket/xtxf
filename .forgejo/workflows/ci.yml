---
name: CI
"on": [push, pull_request]

env:
  ZIG_VERSION: 0.15.1

jobs:
  test:
    name: Test | ${{ matrix.mode }}
    strategy:
      matrix:
        mode: ["fast", "safe", "small", "off"]

    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libdbus-1-dev pkg-config

      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build --release=${{ matrix.mode }} --summary all

      - name: Test
        run: zig build test --release=${{ matrix.mode }} --summary all

  lint:
    name: Format
    runs-on: codeberg-tiny
    if: forgejo.ref_type != 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check .

  release:
    name: Create release
    needs: test
    if: >-
      forgejo.ref_type == 'tag' &&
      forgejo.repository_owner == 'charlesrocket'

    uses: charlesrocket/reusable/.forgejo/workflows/release.yml@trunk
    with:
      skip-assets: true
